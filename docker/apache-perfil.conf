# =====================================================================
# VirtualHost do container.
#
#   DocumentRoot -> /var/www/html/public      (build do React)
#   Alias /api   -> /var/www/html/api/public  (front controller PHP)
#
# As pastas app/, config/, vendor/ e templates_dicas/ ficam fora do
# alcance do navegador: o Alias so expoe api/public.
# =====================================================================

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    Alias /api /var/www/html/api/public

    <Directory /var/www/html/api/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Atras do Traefik o IP real do visitante chega no X-Forwarded-For.
    <IfModule mod_remoteip.c>
        RemoteIPHeader X-Forwarded-For
    </IfModule>

    # O log vai para o stdout/stderr do container, que e onde o
    # Portainer e o docker logs procuram.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
