<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Perfil">
  <!-- Ficha de arquivo: papel, tinta e um carimbo vermelho. -->
  <rect width="512" height="512" fill="#EFE4CD"/>

  <!-- Moldura de tinta com sombra impressa, igual à do jogo. -->
  <rect x="54" y="62" width="380" height="372" fill="#1C1A16"/>
  <rect x="44" y="52" width="380" height="372" fill="#F7F0E1" stroke="#1C1A16" stroke-width="12"/>

  <!-- Furos do fichário. -->
  <circle cx="78" cy="120" r="9" fill="#D8C8A6"/>
  <circle cx="78" cy="180" r="9" fill="#D8C8A6"/>
  <circle cx="78" cy="240" r="9" fill="#D8C8A6"/>
  <circle cx="78" cy="300" r="9" fill="#D8C8A6"/>
  <circle cx="78" cy="360" r="9" fill="#D8C8A6"/>

  <!-- Linhas datilografadas. -->
  <rect x="118" y="298" width="248" height="12" fill="#A29885"/>
  <rect x="118" y="330" width="186" height="12" fill="#A29885"/>
  <rect x="118" y="362" width="214" height="12" fill="#A29885"/>

  <!-- Carimbo: o número da dica. -->
  <g transform="rotate(-6 244 200)">
    <rect x="128" y="120" width="232" height="140" fill="none" stroke="#B3202E" stroke-width="14"/>
    <rect x="146" y="138" width="196" height="104" fill="none" stroke="#B3202E" stroke-width="5"/>
    <text x="244" y="222" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="112"
          font-weight="700" fill="#B3202E" text-anchor="middle" letter-spacing="6">20</text>
  </g>
</svg>
